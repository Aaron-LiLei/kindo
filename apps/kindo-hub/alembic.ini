[alembic]
script_location = alembic
prepend_sys_path = src
# URL is resolved by env.py from Kindo config (KINDO_DATA_DIR / KINDO_CONFIG);
# the value below is only a placeholder.
sqlalchemy.url = sqlite:////data/kindo.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
